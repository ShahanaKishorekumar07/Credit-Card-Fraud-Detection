<!<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .box {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid gray;
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>🔐 Login</h2>

    <form action="/login" method="post">
        <input name="username" placeholder="Username">
        <input name="password" type="password" placeholder="Password">
        <button>Login</button>
    </form>

    <p style="color:red;">{{ error }}</p>
</div>

</body>
</html>
